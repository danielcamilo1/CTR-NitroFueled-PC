name: build and release

# Builds the Windows portable ZIP and the Linux AppImage. Pushes to main and pull requests build
# both (the packages are kept as workflow artifacts); a v* tag also publishes a GitHub release
# with both, so each published binary matches a tagged commit (GPL, CONTRIBUTING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # NVIDIA DLSS SDK bundled in the Windows package (dlss_bridge/, make_portable.py --dlss-sdk).
  DLSS_SDK_TAG: v310.9.1
  # nixpkgs the Linux build and the AppImage's bundled libraries come from: a pinned nixos-unstable
  # revision (vulkan-headers 1.4.357; the 26.05 release's 1.4.341 lacks extensions vk_instance.cpp
  # names). Moving it is a deliberate change, so a tag always builds the same libraries.
  NIXPKGS_REV: 7fd4004d0511991fff3a0524856a9be09e28c5f0

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # The GPU library, Mesa's Vulkan drivers and the AppImage need more than the runner's
      # free space.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # git describe: out/VERSION is the tag
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIXPKGS_REV }}.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Build
        run: nix-shell shell.nix --run 'BB_IN_NIX_SHELL=1 bash build.sh'
      # The GPU library needs its user directory to exist (run.sh makes it and names it); a fresh
      # runner has no ~/.local/share for the fallback.
      - name: Native tests
        run: |
          mkdir -p out/test-user
          BB_GPU_USER_DIR=$PWD/out/test-user nix-shell shell.nix --run 'BB_IN_NIX_SHELL=1 bash build.sh --test'
      - name: Python tests
        run: nix-shell shell.nix --run 'python3 -m unittest discover -s tests'
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_TAG }}
          path: dlss-sdk
          lfs: true
      # libsacredfire_dlss.so and NVIDIA's Linux runtime next to out/sacredfire (into the AppImage).
      - name: DLSS bridge
        run: nix-shell shell.nix --run 'bash dlss_bridge/build.sh "$PWD/dlss-sdk" --install'
      - name: AppImage
        # Builds that are not a tag are test packages: their version is the commit.
        run: |
          [[ $GITHUB_REF == refs/tags/* ]] || export BB_ALLOW_DIRTY=1
          bash packaging/appimage.sh
      # The package the AppImage bundles (the same derivation, already in the store) must carry
      # the DLSS files, the default settings and the merge tool: the source filter in
      # packaging/default.nix drops anything it does not name, silently.
      - name: Check the package contents
        run: |
          pkg=$(nix-build --no-out-link --impure -E "import $PWD/packaging {}")
          d=$pkg/share/sacredfire
          ls -l "$d/bin" "$d/licenses"
          for f in bin/sacredfire bin/gpu/libbbgpu.so bin/libsacredfire_dlss.so \
                   packaging/bbport.default.ini tools/merge_update.py \
                   licenses/NVIDIA-DLSS-SDK-LICENSE.txt licenses/dlss-bridge-LICENSE.txt; do
            [[ -e $d/$f ]] || { echo "missing from the package: $f"; exit 1; }
          done
          ls "$d"/bin/libnvidia-ngx-dlss.so.* >/dev/null
      # The packaged launcher opens its window on a virtual display and keeps running: a Python
      # error while building the settings page would leave no window (the app then quits) or a
      # traceback in its output.
      - name: Launcher smoke test
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          pkg=$(nix-build --no-out-link --impure -E "import $PWD/packaging {}")
          export HOME=$(mktemp -d)
          status=0
          timeout -k 5 30 xvfb-run -a "$pkg/bin/sacredfire" > launcher.log 2>&1 || status=$?
          cat launcher.log
          [[ $status == 124 || $status == 137 ]] || { echo "the launcher exited by itself (status $status)"; exit 1; }
          ! grep -q Traceback launcher.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/SacredFire-x86_64.AppImage
            dist/SacredFire-x86_64.AppImage.sha256
            dist/SacredFire-x86_64.AppImage.build.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-build-log
          path: out/gpu-build.log
          if-no-files-found: ignore

  windows:
    name: Windows portable
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          update: true
          # packaging/windows/README.md
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_TAG }}
          path: dlss-sdk
          lfs: true
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          bash build.sh
      # MSVC gets the Vulkan headers alone: CLANG64's include folder also holds MinGW's CRT headers.
      - name: Vulkan headers for MSVC
        run: mkdir -p vk-include && cp -r /clang64/include/vulkan /clang64/include/vk_video vk-include/
      - name: DLSS bridge (MSVC)
        shell: cmd
        run: dlss_bridge\build.bat "%GITHUB_WORKSPACE%\dlss-sdk" "%GITHUB_WORKSPACE%\vk-include"
      - name: Portable ZIP
        run: |
          export MSYS2_ROOT="$(cygpath -w '${{ steps.msys2.outputs.msys2-location }}')"
          version=$(git describe --tags --match 'v*' --always)
          python packaging/windows/make_portable.py --version "$version" --dlss-sdk "$(cygpath -w "$PWD/dlss-sdk")"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/CTR-NitroFueled-PC-portable-windows.zip
            dist/CTR-NitroFueled-PC-portable-windows.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-log
          path: out/gpu-build.log
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          notes="Built by GitHub Actions from ${TAG} ($(echo $GITHUB_SHA | cut -c1-7)).

          - Windows: CTR-NitroFueled-PC-portable-windows.zip (unzip, open CTR-NitroFueled-PC.exe)
          - Linux: SacredFire-x86_64.AppImage (chmod +x and run; the launcher opens)

          Source of these binaries: this repository at ${TAG}; the AppImage's libraries come from
          nixpkgs ${{ env.NIXPKGS_REV }} (version in SacredFire-x86_64.AppImage.build.txt)."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --verify-tag dist/*
